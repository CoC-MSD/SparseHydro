[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparsehydro"
version = "0.1.0a1"
description = "Interface specifications for parsimonious hydrological models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Caleb Buahin", email = "cbuahin@hazenandsawyer.com" },
    { name = "Trent Schade", email = "trent.schade@cincinnati-oh.gov" },
    { name = "John Barton", email = "john.barton@cincinnati-oh.gov" },
]
maintainers = [
    { name = "Caleb Buahin", email = "cbuahin@hazenandsawyer.com" },
    { name = "Trent Schade", email = "trent.schade@cincinnati-oh.gov" },
    { name = "Filipe Romero", email = "felipe.romero@cincinnati-oh.gov" },
    { name = "Trent Schade", email = "trent.schade@cincinnati-oh.gov" },
    { name = "William Abbey", email = "william.abbey@cincinnati-oh.gov" },
    { name = "Sebastian Otarola-Bustos", email = "SOtarolaBustos@hazenandsawyer.com" },
    { name = "Mickey Tadese", email = "MTadesse@hazenandsawyer.com" },
]

keywords = ["hydrology", "parsimonious", "model", "calibration", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyarrow>=14.0",
    "requests>=2.31",
    "requests-toolbelt>=1.0",
    "torch>=2.0",
    "pymoo>=0.6",
    "plotly>=5.0",
    "platypus-opt>=1.0",
]

[project.optional-dependencies]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "myst-parser>=3.0",
    "sphinx-design>=0.5",
    "sphinxcontrib-mermaid>=0.9",
]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "sparsehydro[docs]",
]

[project.urls]
Homepage = "https://coc-msd.github.io/SparseHydro/#documentation"
Repository = "https://github.com/MSDGC-SWM/sparsehydro"
Documentation = "https://MSDGC-SWM.github.io/sparsehydro"
Issues = "https://github.com/MSDGC-SWM/sparsehydro/issues"

[tool.hatch.build.targets.wheel]
packages = ["sparsehydro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=sparsehydro --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["sparsehydro"]
